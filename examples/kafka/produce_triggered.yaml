# Generate sample events at a fixed interval and produce them to Kafka.
#
# This demonstrates a self-contained Kafka producer flow without external
# dependencies other than a running Kafka broker. The generate task creates
# JSON events that are forwarded directly to the Kafka topic.
#
# Required:
#   - Kafka brokers accessible at localhost:9092
flow:
  labels:
    display_name: "Kafka Produce (Triggered)"
    description: "Generates periodic events and produces them to a Kafka topic."
    tags: ["kafka", "producer", "generate", "example"]
  tasks:

    - generate:
        name: trigger
        interval: 60s
        count: 5
        data:
          source: "flowgen-example"
          timestamp: "{{now}}"

    - kafka_produce:
        name: produce_sample
        brokers: "localhost:9092"
        topic: sample-events
